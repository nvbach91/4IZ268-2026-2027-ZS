<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Long live SPARTA!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/main.css" />
</head>

<body>
  <div class="cipher-box">
    <h1>Long live Sparta!</h1>
    <form id="cipher-form">
      <textarea id="cipher-text" rows="6" placeholder="Encrypted text..."></textarea>
      <input type="number" id="cipher-key" placeholder="Key used..." />
      <button type="submit" id="decipher-btn">Decipher!</button>
    </form>
  </div>
  <div id="deciphered-output" class="output"></div>
  <script src="js/main.js"></script>
</body>

</html>
