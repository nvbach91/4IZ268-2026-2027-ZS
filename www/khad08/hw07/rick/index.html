<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick and Morty Pexeso</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <header>
            <h1>🌀 RICK & MORTY 🌀</h1>
            <div class="stats-bar">
                <span>Skóre: <strong id="score-display">0</strong></span>
                <span>•</span>
                <span>Otočení: <strong id="moves-display">0</strong></span>
            </div>
        </header>

        <!-- Game Board -->
        <div class="board" id="game-board"></div>
    </div>

 
    <div class="modal-overlay" id="win-modal">
        <div class="modal-content">
            <h2>WUBBA LUBBA DUB DUB! 🎉</h2>
            <p id="final-message">Dokázal/a jsi to! Prošel/a jsi multiverzem a našel/a všechny dvojice. Tvoje konečné skóre je <strong id="final-score">0</strong> bodů.</p>
            <button class="btn-restart" id="modal-restart-btn">Další Dimenze</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
