<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Long live SPARTA!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
    <h1>Long live SPARTA!</h1>
    <p class="subtitle">Caesar Cipher Decryptor</p>

    <div class="form-group">
      <label for="cipher-text">Encrypted Text:</label>
      <textarea id="cipher-text" rows="4" placeholder="Enter encrypted text here..."></textarea>
    </div>

    <div class="form-group">
      <label for="key-input">Shift Key (number):</label>
      <input type="number" id="key-input" value="19" />
    </div>

    <button id="decipher-btn">Decipher!</button>

    <div class="result-container">
      <h3>Decrypted Output:</h3>
      <div id="output-result" class="output-box">Your decrypted text will appear here...</div>
    </div>
  </div>

  <script src="main.js"></script>
</body>

</html>
