<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <h1>JavaScript is awesome!</h1>
    <div id="tasks"></div>

    <h2>Pepe's Age</h2>
    <form id="ageForm">
        <label for="bornYear">Pepe was born in:</label>
        <input type="number" id="bornYear" min="1926" max="2026" required>
        <!--<button type="submit">Calculate age</button>-->
    </form>
    <p id="answer"></p>

    <h2>WTF (wow, that's fun)</h2>
    <h3>Convert Degrees</h3>
        <label for="wtfInput">Enter a number:</label>
        <input type="number" id="wtfInput">
        <button id="celsia">Calculate Celsius</button>
        <button id="fahrenheiht">Calculate Fahrenheiht</button>
    </h3>
    <p id="wtf"></p>

    <h2>Numbers</h2>
    <p id="number"></p>
    <form >
        <input type="number" id="a" placeholder="Enter 1 number">
        <input type="number" id="b" placeholder="Enter 2 number">
        
    </form>
    <button id="compare">compare</button>
    <p id="result"></p>

    

    <h2>Multiples of 13</h2>
    <p id="multiples"></p>


    <h2>Circle Area</h2>
    <form id="circleForm">
        <label for="radius">Enter the radius of the circle:</label>
        <input type="number" id="radius">
        <button type="submit" id="calculateArea">Calculate Area</button>
    </form>
    <p id="circleResult"></p>



    <script src="./homework.js"></script>
</body>
