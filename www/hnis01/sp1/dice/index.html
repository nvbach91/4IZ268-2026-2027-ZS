<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice</title>
    <link rel="stylesheet" href="../assets/css/general.css">
    <link rel="stylesheet" href="../assets/css/dice.css">
    <link rel="icon" type="image/x-icon" href="https://img.icons8.com/color/1200/dungeons-and-dragons.jpg">
</head>

<body>
    <header>
        <nav>
            <a class="headerItem" href="../frontpage/">Home</a>
            <a class="headerItem" href="../rules/">Rules</a>
            <a class="headerItem" href="../dice/">Dice</a>
            <a class="headerItem" href="../books/">Books</a>
            <a class="headerItem" href="../detail/">New Character</a>
        </nav>
        <nav>
            <a class="headerItem">Sign in</a>
            <a class="headerItem">Login in</a>
        </nav>
    </header>

    <main>

        <div class="diceContainer">
            <div class="dice">
                <img src="../assets/img/d4texture-removebg-preview.png" alt="d4-image">
                <input id="d4s" type="number" value="0">
            </div>

            <div class="dice">
                <img src="../assets/img/d6texture-removebg-preview.png" alt="d6-image">
                <input id="d6s" type="number" value="0">
            </div>


            <div class="dice">
                <img src="../assets/img/d8texturel-removebg-preview.png" alt="d8-image">
                <input id="d8s" type="number" value="0">
            </div>


            <div class="dice">
                <img src="../assets/img/d10texture-removebg-preview.png" alt="d10-image">
                <input id="d10s" type="number" value="0">
            </div>


            <div class="dice">
                <img src="../assets/img/d12texture-removebg-preview.png" alt="d12-image">
                <input id="d12s" type="number" value="0">
            </div>


            <div class="dice">
                <img src="../assets/img/d20texture-removebg-preview.png" alt="d20-image">
                <input id="d20s" type="number" value="0">
            </div>

            <div class="dice">
                <img src="../assets/img/d100texture-removebg-preview.png" alt="d100-image">
                <input id="d100s" type="number" value="0">
            </div>


        </div>


        <!--change name later-->
        <div class="else">
            <div id="outcome">20</div>
            <div class="modifiers">

                <button id="roll">Roll</button>
                <input type="number" placeholder="Modifier">
                <div class="rerolls">
                    <button>Advantage</button>
                    <button>Disadvantage</button>
                </div>

            </div>
            <div class="presetContainer">
                <div class="newCharacter preset"><label>New character</label>
                    <div><button>Set</button></div>
                </div>
                <div class="levelUpHealth preset"> <label>Level up</label>
                    <div><button>Set</button>
                        <select id="cars" name="cars">
                            <option value="" disabled selected>Select your class</option>
                            <option value="Barbarian">Barbarian</option>
                            <option value="Bard">Bard</option>
                            <option value="Cleric">Cleric</option>
                            <option value="Druid">Druid</option>
                            <option value="Fighter">Fighter</option>
                            <option value="Monk">Monk</option>
                            <option value="Paladin">Paladin</option>
                            <option value="Ranger">Ranger</option>
                            <option value="Rogue">Rogue</option>
                            <option value="Sorcerer">Sorcerer</option>
                            <option value="Warlock">Warlock</option>
                            <option value="Wizard">Wizard</option>
                            <option value="Artificer">Artificer</option>
                        </select>
                    </div>
                </div>
                <div class="concentration preset"><label>concentration</label>
                    <div> <button>Set</button> <input id="damage" type="number" value="0"></div>
                </div>
            </div>

        </div>

    </main>

    <footer>
        <div class="footerItem">
            <h4>Support</h4>
            <a>Support forum</a>
            <a>Cookies</a>
            <a>Privacy</a>

        </div>
        <div class="footerItem">
            <h4> About</h4>
            <a>Contact</a>
            <a>Credits</a>

        </div>
        <div class="footerItem">
            <h4> Socials</h4>
            <a>Discord</a>
            <a>Reddit</a>
            <a>Youtube</a>
        </div>
    </footer>
</body>

</html>
