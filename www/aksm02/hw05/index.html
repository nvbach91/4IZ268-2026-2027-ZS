<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript is awesome!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #333;
        }

        #tasks {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            background-color: #007BFF;
            color: white;
            border-radius: 5px;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #0056b3;
        }

        #results {
            padding: 15px;
            background-color: #fff;
            font-family: monospace;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-top: 20px;
            min-height: 40px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <h1>JavaScript is awesome!</h1>
    <div id="tasks"></div>
    <div id="results"></div>

    <script src="homework.js"></script>
</body>

</html>
