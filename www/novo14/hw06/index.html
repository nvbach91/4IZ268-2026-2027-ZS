<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Long live SPARTA!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>
  <div class="container">
    <h1>Caesar Cipher Decrypter</h1>
    
    <div class="cipher-fields">
      <textarea id="cipher-text" placeholder="Enter ciphered text.."></textarea>
    </div>

    <div class="cipher-fields">
      <input id="cipher-key" placeholder="Enter key fot the cipher..">
    </div>

    <button id="decipher-button">Decipher!</button>

    <div id="output">
      <h2>Deciphered text:</h2>
      <p id="output-text"></p>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
