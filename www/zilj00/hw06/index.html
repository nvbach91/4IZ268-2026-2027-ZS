<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Long live SPARTA!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/main.css" />
</head>

<body>

  <div class="form-container">
    <h1>Long live Sparta!</h1>
    <form id="cipher-form">
      <textarea id="cipher-text" placeholder="Enter encrypted text...">UF'E YADBTUZ' FUYQ.</textarea>
      <input type="text" id="cipher-key" placeholder="Enter key..." value="12">
      <button type="submit" id="decipher-btn">Decipher!</button>
    </form>
  </div>

  <div class="result-container">
    <p id="output">IT'S MORPHIN' TIME.</p>
  </div>

  <script src="js/main.js"></script>
</body>

</html>
