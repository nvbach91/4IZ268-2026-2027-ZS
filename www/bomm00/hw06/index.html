<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Long live SPARTA!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div id="form">
    <h1>Long live Sparta!</h1>
    <div id="form-fields">
      <form id="cipher-form">
        <div id="ciphered-text-container">
          <textarea name="ciphered-text" placeholder="Insert ciphered text" required></textarea>
        </div>
        <div id="cipher-key-container">
          <input name="cipher-key" type="number" placeholder="Insert cipher key" required>
        </div>
        <button id="submit">Decipher!</button>
      </form>
    </div>
  </div>
  <div id="result"></div>
  <script src="main.js"></script>
</body>

</html>
