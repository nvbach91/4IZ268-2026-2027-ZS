<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Long live SPARTA!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>

<body>
  <div class="app-container">
    <h1>Long live Sparta!</h1>
    
    <textarea id="cipher-text" placeholder="Enter encrypted text (e.g., UFE YADBTUZ' FUYQ.)"></textarea>
    <input type="number" id="cipher-key" placeholder="Enter key (e.g., 12)" />
    
    <button id="decipher-btn">Decipher!</button>

    <div class="output-wrapper">
        <div id="deciphered-output"></div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
</body>

</html>
