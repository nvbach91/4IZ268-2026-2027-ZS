<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Long live SPARTA!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css?family=Open+Sans" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css" />
</head>

<body>
  <main>
    <form id="cipher-form" class="cipher-box">
      <h1>Long live Sparta!</h1>
      <textarea id="cipher-text" placeholder="Encrypted text" rows="5" required></textarea>
      <input id="cipher-key" type="number" placeholder="Key used" required>
      <button type="submit">Decipher!</button>
    </form>
    <hr>
    <h2 id="result"></h2>
    <hr>
  </main>

  <script src="js/main.js"></script>
</body>

</html>
