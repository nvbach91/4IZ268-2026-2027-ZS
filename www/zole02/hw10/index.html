<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Git The Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,700"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" media="screen" href="css/main.css" />
  </head>

  <body>
    <header>
      <h1>Git The Hub</h1>
      <p>Zadejte uživatelské jméno a vyhledejte uživatele na GitHubu.</p>
    </header>

    <main>
      <form id="search-form" novalidate>
        <label for="username">Uživatelské jméno</label>
        <div class="search-row">
          <input
            id="username"
            name="username"
            type="text"
            placeholder="např. octocat"
            autocomplete="off"
            aria-describedby="form-error"
          />
          <button id="search-button" type="submit">Hledat</button>
        </div>
        <p id="form-error" class="form-error"></p>
      </form>

      <div id="loader" class="loader" hidden>
        <span class="spinner"></span>
        <span>Načítám…</span>
      </div>

      <p id="message" class="message"></p>

      <section id="user-profile" class="user-profile" hidden></section>

      <section id="repositories-section" hidden>
        <h2>Repozitáře</h2>
        <ul id="repositories" class="repositories"></ul>
      </section>
    </main>

    <footer>
      <p>2026 &copy; zole02 – 4IZ268</p>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"
      defer
    ></script>
    <script src="js/main.js" defer></script>
  </body>
</html>
